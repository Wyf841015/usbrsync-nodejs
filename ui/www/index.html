<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="/app/usbrsync/"><title>USB Rsync</title><link rel="stylesheet" href="css/style.css"></head><body>
<header class="h"><div class="hc"><h1>USB RSYNC <small>v0.4.1</small></h1><div class="header-actions"><span class="hs"><span class="dot"></span><span id="status-text">加载中</span></span><button class="btn bs" onclick="showLogs()">日志</button><button class="btn bs" onclick="exportConfig()">导出</button><button class="btn bp" onclick="document.getElementById('import-file').click()">导入</button><input id="import-file" type="file" accept="application/json" hidden onchange="importConfig(this)"><button type="button" class="sponsor-btn" onclick="showSponsorModal()" title="赞助作者">❤ 赞助</button><button type="button" class="theme-btn" id="themeBtn" onclick="toggleTheme()" title="切换主题">🌙</button></div></div></header>
<main class="ct"><section class="kpis"><article><b id="k-device">0</b><span>USB 设备</span></article><article><b id="k-task">0</b><span>同步任务</span></article><article><b id="k-success">0</b><span>成功次数</span></article><article><b id="k-bytes">0 B</b><span>传输总量</span></article></section>
<div class="g"><section class="card"><div class="ch"><div class="ctitle">已连接设备</div><button class="btn bs btn-sm" onclick="loadDevices()">刷新</button></div><div id="devices"></div></section>
<section class="card"><div class="ch"><div class="ctitle">存储空间</div><button class="btn bs btn-sm" onclick="loadDrives()">刷新</button></div><div id="drives"></div></section>
<section class="card fw"><div class="ch"><div class="ctitle">同步任务</div><div class="toolbar"><button class="btn bs btn-sm" onclick="sortTasks()">排序</button><button class="btn bp btn-sm" onclick="editTask(-1)">添加任务</button></div></div><div id="tasks"></div></section>
<section class="card fw"><div class="ch"><div class="ctitle">同步进度</div></div><div id="sync-progress"><div class="nd">空闲</div></div></section>
<section class="card fw"><div class="ch"><div class="ctitle">同步历史与统计</div><div class="toolbar"><button class="btn bs btn-sm" onclick="loadHistory()">刷新</button><button class="btn bd btn-sm" onclick="clearHistory()">清空</button></div></div><div id="history"></div></section></div></main>
<div class="modal" id="task-modal"><div class="mc wide"><div class="mh"><span class="mt">任务设置</span><button class="close" onclick="closeTaskModal()">×</button></div><div class="form-grid"><label>任务名称<input id="f-name" class="form-control"></label><label>绑定 USB<select id="f-device" class="form-control"><option value="">任意设备</option></select></label><label class="span2">源目录<div class="input-action"><input id="f-source" class="form-control"><button class="btn bs" onclick="openBrowse('source')">浏览</button></div></label><label class="span2">目标目录<div class="input-action"><input id="f-target" class="form-control"><button class="btn bs" onclick="openBrowse('target')">浏览</button></div></label><label>计划<select id="f-schedule" class="form-control"><option value="none">不计划</option><option value="daily">每天</option><option value="weekly">每周</option></select></label><label>执行时间<input id="f-time" type="time" class="form-control" value="02:00"></label><label>重试次数<input id="f-retry" type="number" min="0" max="10" class="form-control" value="2"></label><label>重试间隔（秒）<input id="f-delay" type="number" min="1" max="300" class="form-control" value="5"></label><label class="span2">任务排除规则<textarea id="f-exclusions" class="form-control" rows="3" placeholder="每行一个，例如 *.tmp"></textarea></label></div><div class="options"><label><input id="f-enabled" type="checkbox" checked> 启用任务</label><label><input id="f-auto" type="checkbox"> 插入后自动同步</label><label><input id="f-bidir" type="checkbox"> 双向同步</label><label><input id="f-delete" type="checkbox"> 删除目标多余文件</label><label><input id="f-space" type="checkbox" checked> 同步前检查空间</label><label><input id="f-checksum" type="checkbox"> SHA 校验模式</label><label><input id="f-notify" type="checkbox" checked> 完成后系统通知</label><label><input id="f-keep" type="checkbox"> 保留历史版本 (rsync-history)</label></div><div class="btn-group"><button class="btn bs" onclick="closeTaskModal()">取消</button><button class="btn bs" onclick="previewEditingTask()">试运行预览</button><button class="btn bp" onclick="saveTaskEditor()">保存任务</button></div></div></div>
<div class="modal" id="browse-modal"><div class="mc"><div class="mh"><span class="mt">选择目录</span><button class="close" onclick="closeBrowse()">×</button></div><div id="browse-path" class="path"></div><div id="browse-list" class="browse-list"></div><div class="btn-group"><button class="btn bs" onclick="closeBrowse()">取消</button><button class="btn bp" onclick="confirmBrowse()">选择当前目录</button></div></div></div>
<div class="modal" id="result-modal"><div class="mc wide"><div class="mh"><span class="mt" id="result-title">结果</span><button class="close" onclick="closeResult()">×</button></div><div id="result-summary" class="result-summary"></div><pre id="result-content" class="log-box"></pre></div></div>
<div id="sponsorModal" class="sponsor-modal-overlay" onclick="if(event.target===this)this.classList.remove('show')"><div class="sponsor-modal-content" onclick="event.stopPropagation()"><div class="sponsor-header"><h3>❤ 感谢您的支持</h3><button type="button" class="sponsor-modal-close" onclick="document.getElementById('sponsorModal').classList.remove('show')">✕</button></div><p class="sponsor-sub">您的赞助是我持续开发的最大动力</p><div class="sponsor-qr-row"><div class="sponsor-qr-item"><p>支付宝</p><img src="images/sponsor_alipay.png" alt="支付宝赞助" onclick="showSponsorImgFull(this)"></div><div class="sponsor-qr-item"><p>微信</p><img src="images/sponsor_wechat.png" alt="微信赞助" onclick="showSponsorImgFull(this)"></div></div></div></div>
<div id="sponsorImgOverlay" class="sponsor-img-full-overlay" onclick="if(event.target===this)this.classList.remove('show')"><img id="sponsorImgFull" alt="大图" onclick="event.stopPropagation()"></div>
<script src="js/main.js"></script></body></html>
